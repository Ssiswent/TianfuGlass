name: Build unsigned IPA (Xcode 27)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"
      - "Sources/**"
      - "project.yml"

permissions:
  contents: read

concurrency:
  group: tianfuglass-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package iOS app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild -list -project TianfuGlass.xcodeproj

      - name: Build unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project TianfuGlass.xcodeproj \
            -scheme TianfuGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            'DEVELOPMENT_TEAM=' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TianfuGlass.app"
          test -f "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/TianfuGlass.app"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/TianfuGlass-v0.4.0-unsigned.ipa")
          test -s TianfuGlass-v0.4.0-unsigned.ipa
          unzip -t TianfuGlass-v0.4.0-unsigned.ipa > /dev/null
          unzip -Z1 TianfuGlass-v0.4.0-unsigned.ipa | grep -F 'Payload/TianfuGlass.app/Info.plist'
          echo "Unsigned IPA archive verified."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianfuGlass-v0.4.0-unsigned-IPA
          path: TianfuGlass-v0.4.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TianfuGlass-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
