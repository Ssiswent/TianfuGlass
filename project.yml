name: TianfuGlass
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  TianfuGlass:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: Generate reproducible AppIcon
        script: |
          cd "$PROJECT_DIR"
          ICON="Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ ! -s "$ICON" ] || [ scripts/generate_app_icon.swift -nt "$ICON" ]; then
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" /usr/bin/swift scripts/generate_app_icon.swift
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiswent.TianfuGlass
        PRODUCT_NAME: TianfuGlass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "天府通 Glass"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        CURRENT_PROJECT_VERSION: "20"
        MARKETING_VERSION: "0.8.1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
